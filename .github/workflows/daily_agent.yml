name: Daily Autonomous Cash Agent

on:
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub
  schedule:
    - cron: '0 8 * * *' # S'exécute automatiquement chaque jour à 08h00 UTC

jobs:
  run-agents:
    runs-on: ubuntu-latest
    
    # Autorise le bot GitHub à publier/sauvegarder les fichiers dans le dépôt
    permissions:
      contents: write

    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installer les dépendances
        run: |
          pip install google-genai

      - name: 🤖 Lancer l'orchestrateur d'agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent_orchestrator.py

      - name: 🚀 Sauvegarder et pousser le rapport sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Ajout automatique du rapport quotidien 0 DH" && git push)
